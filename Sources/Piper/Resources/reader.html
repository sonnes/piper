<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>Reader</title>
<!--
The Reader tab of a link capture. Piper loads this page into a WKWebView and
calls window.piper with the article and its child notes. The page sends each
action to Piper through the "piper" message handler. The colors match
PiperTheme: the accent, the Claude orange, and the Tailwind marks.
-->
<style>
:root {
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", sans-serif;
  --serif: "New York", ui-serif, "Iowan Old Style", Georgia, serif;
  --label: rgba(0,0,0,.85);
  --secondary: rgba(0,0,0,.5);
  --tertiary: rgba(0,0,0,.3);
  --accent: #086AEE;
  --claude: #F97316;
  --reader: #FBFAF7;
  --card: #fff;
  --sep: rgba(0,0,0,.09);
  --hover: rgba(0,0,0,.045);
  --textsel: rgba(8,106,238,.2);
  --mark-yellow: rgba(250,204,21,.38);
  --mark-green: rgba(74,222,128,.32);
  --mark-pink: rgba(244,114,182,.28);
  --card-shadow: 0 0 0 .5px rgba(0,0,0,.1), 0 4px 16px rgba(0,0,0,.08);
  --bar: #1F1F21;
  --shine: rgba(0,0,0,.09);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --label: rgba(255,255,255,.88);
    --secondary: rgba(255,255,255,.55);
    --tertiary: rgba(255,255,255,.3);
    --accent: #5E9EF4;
    --claude: #FB923C;
    --reader: #1B1B1C;
    --card: #2C2C2E;
    --sep: rgba(255,255,255,.1);
    --hover: rgba(255,255,255,.06);
    --textsel: rgba(94,158,244,.3);
    --mark-yellow: rgba(250,204,21,.28);
    --mark-green: rgba(74,222,128,.22);
    --mark-pink: rgba(244,114,182,.24);
    --card-shadow: 0 0 0 .5px rgba(255,255,255,.1), 0 6px 20px rgba(0,0,0,.4);
    --bar: #3A3A3C;
    --shine: rgba(255,255,255,.12);
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--reader); }
body { font: 13px/1.4 var(--font); color: var(--label); -webkit-font-smoothing: antialiased; }
.page { display: grid; grid-template-columns: minmax(0, 560px) 250px; gap: 36px; padding: 36px 40px 80px 56px; position: relative; max-width: 942px; margin: 0 auto; }
.article { font: 16.5px/1.6 var(--serif); position: relative; min-width: 0; }
.article ::selection { background: var(--textsel); }
.kicker { font: 600 11px var(--font); letter-spacing: .04em; text-transform: uppercase; color: var(--tertiary); }
.article h1 { font: 600 30px/1.15 var(--serif); margin: 6px 0 8px; letter-spacing: -.01em; }
.article h2 { font: 600 21px/1.25 var(--serif); margin: 28px 0 10px; }
.article h3 { font: 600 18px/1.3 var(--serif); margin: 24px 0 8px; }
.byline { font: 12.5px var(--font); color: var(--secondary); margin-bottom: 20px; display: flex; gap: 12px; }
.article p, .article li, .article blockquote, .article pre { margin: 0 0 18px; }
.article li { margin: 0 0 6px 22px; display: list-item; list-style: disc; }
.article li + :not(li) { margin-top: 18px; }
.article blockquote { border-left: 2px solid var(--sep); padding-left: 16px; color: var(--secondary); font-style: italic; }
.article pre { font: 13px/1.5 ui-monospace, "IBM Plex Mono", monospace; white-space: pre-wrap; background: var(--hover); padding: 10px 12px; border-radius: 6px; }
mark { color: inherit; border-radius: 2px; padding: 1px 0; background: none; }
mark.yellow { background: var(--mark-yellow); }
mark.green { background: var(--mark-green); }
mark.pink { background: var(--mark-pink); }
mark.now { box-shadow: 0 0 0 3px rgba(250,204,21,.35); }
.article [data-b] { transition: opacity .6s ease; }
.article .above { opacity: .4; }
mark { transition: box-shadow .6s ease; }
mark.q { text-decoration: underline; text-decoration-color: var(--claude); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: pointer; }
.message { font: 13px var(--font); color: var(--secondary); padding-top: 120px; text-align: center; grid-column: 1 / -1; animation: fade .3s ease both; }

/* loading: the known site and title, and lines that shimmer until the text arrives */
.sk { height: 13px; margin: 0 0 11px; border-radius: 4px; background: linear-gradient(90deg, var(--hover) 25%, var(--shine) 50%, var(--hover) 75%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; }
.sk.title { height: 28px; width: 78%; margin: 8px 0 10px; }
.sk.title + .sk.title { width: 46%; }
.sk.byline { height: 11px; width: 28%; margin: 4px 0 30px; }
.skeleton .para { margin-bottom: 26px; }
.skeleton h1 { animation: breathe 2.4s ease-in-out infinite; }
.slow { font: 12.5px var(--font); color: var(--tertiary); opacity: 0; transition: opacity .6s ease; }
.slow.on { opacity: 1; }
.enter > * { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes breathe { 50% { opacity: .55; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sk, .skeleton h1, .enter > *, .message { animation: none !important; }
}
.message b { display: block; font-size: 15px; color: var(--label); margin-bottom: 4px; font-weight: 600; }

/* selection bar */
.selbar { position: absolute; display: none; align-items: center; flex-wrap: wrap; max-width: 100%; gap: 2px; padding: 4px; border-radius: 9px; background: var(--bar); color: #fff; font: 12.5px var(--font); box-shadow: 0 8px 24px rgba(0,0,0,.25); white-space: nowrap; z-index: 5; -webkit-user-select: none; user-select: none; }
.selbar span { padding: 4px 9px; border-radius: 6px; cursor: default; }
.selbar span:hover { background: rgba(255,255,255,.12); }
.selbar span.ask { background: rgba(255,255,255,.14); display: inline-flex; gap: 5px; align-items: center; }
.selbar .div { width: 1px; height: 16px; background: rgba(255,255,255,.18); margin: 0 3px; padding: 0; }
.selbar .div:hover { background: rgba(255,255,255,.18); }
.selbar .sw { width: 14px; height: 14px; border-radius: 50%; padding: 0; margin: 0 3px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.25); }
.selbar .sw.yellow { background: #FACC15; } .selbar .sw.green { background: #4ADE80; } .selbar .sw.pink { background: #F472B6; }
.selbar .kb { opacity: .45; font-size: 11px; }
.askline { position: absolute; display: none; align-items: center; gap: 8px; width: 380px; max-width: 100%; padding: 6px 6px 6px 12px; border-radius: 10px; background: var(--bar); color: #fff; font: 13px var(--font); box-shadow: 0 8px 24px rgba(0,0,0,.25); z-index: 6; }
.askline input { flex: 1; min-width: 0; background: none; border: 0; outline: 0; color: #fff; font: inherit; }
.askline input::placeholder { color: rgba(255,255,255,.45); }
.askline kbd { font: 11px var(--font); padding: 3px 7px; border-radius: 5px; background: var(--claude); color: #fff; }
.askline .star { color: var(--claude); }

/* margin cards */
.margin { position: relative; }
.card { position: absolute; left: 0; width: 250px; background: var(--card); border-radius: 10px; box-shadow: var(--card-shadow); font: 12.5px/1.5 var(--font); padding: 10px 12px 10px; }
.card::before { content: ""; position: absolute; left: -36px; top: 15px; width: 30px; border-top: 1.5px dashed var(--claude); opacity: .6; }
.card .ch { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--secondary); margin-bottom: 6px; }
.card .ch b { color: var(--claude); font-weight: 600; }
.card button { background: none; border: 0; margin: 0; padding: 0; font: inherit; color: inherit; cursor: default; border-radius: 3px; }
.card button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card.min:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.card .ch .x { margin-left: auto; color: var(--tertiary); padding: 0 2px; }
.card .quote { font: italic 12px/1.4 var(--serif); color: var(--secondary); border-left: 2px solid var(--sep); padding-left: 8px; margin-bottom: 8px; }
.card p { margin: 0 0 8px; white-space: pre-line; overflow-wrap: anywhere; }
.card code { font: 11.5px ui-monospace, "IBM Plex Mono", monospace; background: var(--hover); padding: 0 3px; border-radius: 3px; }
.card .q { font-weight: 600; margin: 10px 0 4px; }
.card .quote + .q { margin-top: 0; }
.card .failure { color: var(--secondary); }
.card .tools { font-size: 11px; color: var(--tertiary); margin: -2px 0 6px; }
.card .acts { display: flex; gap: 12px; align-items: center; border-top: 1px solid var(--sep); padding-top: 8px; margin-top: 4px; font-size: 11.5px; color: var(--accent); }
.card .acts button, .card .acts span { white-space: nowrap; }
.card .acts .muted { color: var(--tertiary); margin-left: auto; }
.card .follow { margin-top: 8px; width: 100%; height: 28px; border-radius: 7px; background: var(--hover); border: 0; outline: 0; padding: 0 8px; color: var(--label); font: 12.5px var(--font); }
.card .follow::placeholder { color: var(--tertiary); }
.card.mine::before { border-color: var(--tertiary); opacity: 1; }
.card.mine .ch b { color: var(--label); }
.card.mine .ch .when { margin-left: auto; color: var(--tertiary); }
.card.mine p:last-child { margin-bottom: 0; }
.askline.note kbd { background: var(--accent); }
.askline.note .star { color: var(--accent); }
.card.min { padding: 7px 12px; color: var(--secondary); cursor: default; }
.card.min::before { top: 14px; border-color: var(--tertiary); }
.card.min .ch { margin: 0; }
.typing { margin: 0 0 4px; }
.typing i { display: inline-block; width: 5px; height: 5px; border-radius: 50%; background: var(--tertiary); margin-right: 3px; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
@media (max-width: 899px) {
  .page { grid-template-columns: minmax(0, 640px); gap: 24px; padding: 30px clamp(24px, 6vw, 48px) 80px; max-width: 736px; }
  .margin { display: flex; flex-direction: column; gap: 12px; }
  .card { position: relative; top: auto !important; width: 100%; }
}
</style>
</head>
<body>
<div class="page" id="page">
  <div class="article" id="article"></div>
  <div class="margin" id="margin"></div>
</div>
<div class="selbar" id="selbar">
  <span class="ask" data-act="ask">&#10035; Ask <span class="kb">&#8984;K</span></span>
  <span data-act="explain">Explain</span>
  <span data-act="define">Define</span>
  <span class="div"></span>
  <span class="sw yellow" data-act="highlight" data-color="yellow" title="Yellow"></span>
  <span class="sw green" data-act="highlight" data-color="green" title="Green"></span>
  <span class="sw pink" data-act="highlight" data-color="pink" title="Pink"></span>
  <span class="div"></span>
  <span data-act="note">Note <span class="kb">N</span></span>
  <span data-act="capture">Capture</span>
</div>
<div class="askline" id="askline"><span class="star">&#10035;</span><input id="askinput" placeholder="Ask about the selected text"><kbd>&#8617;</kbd></div>
<div class="askline note" id="noteline"><span class="star">&#9998;</span><input id="noteinput" placeholder="Add a note to the selected text"><kbd>&#8617;</kbd></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const page = $('#page'), margin = $('#margin'), bar = $('#selbar'), askline = $('#askline'), askinput = $('#askinput');
  const noteline = $('#noteline'), noteinput = $('#noteinput');
  let article = $('#article');
  let blocks = [];
  let notes = [];
  let marksKey = '';
  let pendingAnchor = null;
  const collapsed = new Set();

  const post = message => window.webkit?.messageHandlers?.piper?.postMessage(message);

  // ---------- article ----------

  let slowTimer = null;
  // True while the page shows the loading lines. The article that replaces
  // them rises into place.
  let waiting = false;
  let knownTitle = false;
  let entering = false;

  function message(title, detail) {
    clearTimeout(slowTimer);
    waiting = false;
    article.classList.remove('skeleton');
    article.removeAttribute('aria-busy');
    article.replaceChildren();
    const box = document.createElement('div');
    box.className = 'message';
    const b = document.createElement('b');
    b.textContent = title;
    box.append(b, detail);
    article.append(box);
    margin.replaceChildren();
    blocks = [];
    marksKey = '';
  }

  function placeholderLine(className, width) {
    const el = document.createElement('div');
    el.className = 'sk' + (className ? ' ' + className : '');
    if (width) el.style.width = width + '%';
    return el;
  }

  // The site and the title that Piper already knows, and lines in the shape
  // of paragraphs. After a few seconds, a line says that the page is slow.
  function loading(info) {
    clearTimeout(slowTimer);
    const fresh = document.createElement('div');
    fresh.className = 'article skeleton';
    fresh.id = 'article';
    fresh.setAttribute('aria-busy', 'true');
    const kicker = document.createElement('div');
    kicker.className = 'kicker';
    kicker.textContent = info.site;
    fresh.append(kicker);
    knownTitle = !!info.title;
    if (knownTitle) {
      const title = document.createElement('h1');
      title.textContent = info.title;
      fresh.append(title);
    } else {
      fresh.append(placeholderLine('title'), placeholderLine('title'));
    }
    fresh.append(placeholderLine('byline'));
    for (const widths of [[100, 97, 99, 64], [100, 95, 72], [100, 98, 96, 99, 41]]) {
      const para = document.createElement('div');
      para.className = 'para';
      widths.forEach(width => para.append(placeholderLine('', width)));
      fresh.append(para);
    }
    const slow = document.createElement('div');
    slow.className = 'slow';
    slow.textContent = `Still reading ${info.site}. A slow page can take 20 seconds.`;
    fresh.append(slow);
    article.replaceWith(fresh);
    article = fresh;
    margin.replaceChildren();
    blocks = [];
    marksKey = '';
    waiting = true;
    slowTimer = setTimeout(() => slow.classList.add('on'), 5000);
  }

  // Makes the children of the article rise in turn. A title that the loading
  // lines already showed stays in place.
  function enter(el) {
    el.classList.add('enter');
    [...el.children].forEach((child, index) => {
      if (knownTitle && index < 2) { child.style.animation = 'none'; return; }
      child.style.animationDelay = Math.min(index * 40, 320) + 'ms';
    });
    setTimeout(() => {
      el.classList.remove('enter');
      [...el.children].forEach(child => { child.style.animation = ''; child.style.animationDelay = ''; });
    }, 1000);
  }

  function renderArticle(data) {
    const fresh = document.createElement('div');
    fresh.className = 'article';
    fresh.id = 'article';
    const kicker = document.createElement('div');
    kicker.className = 'kicker';
    kicker.textContent = data.site;
    const title = document.createElement('h1');
    title.textContent = data.title;
    const byline = document.createElement('div');
    byline.className = 'byline';
    for (const part of data.byline) {
      const span = document.createElement('span');
      span.textContent = part;
      byline.append(span);
    }
    fresh.append(kicker, title, byline);
    data.blocks.forEach((block, index) => {
      const tag = { heading: 'h2', subheading: 'h3', quote: 'blockquote', item: 'li', code: 'pre' }[block.kind] || 'p';
      const el = document.createElement(tag);
      el.dataset.b = index;
      el.textContent = block.text;
      fresh.append(el);
    });
    article.replaceWith(fresh);
    article = fresh;
    // Piper sends the notes just after the article, and they draw the
    // article again. That second drawing rises too.
    if (waiting) {
      waiting = false;
      entering = true;
      clearTimeout(slowTimer);
      setTimeout(() => { entering = false; }, 200);
    }
    if (entering) enter(fresh);
  }

  // Wraps the text from offset to offset + length of one block in marks.
  function markRange(block, offset, length, className, id) {
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    const end = offset + length;
    let position = 0, node, parts = [];
    while ((node = walker.nextNode())) {
      const start = position, stop = position + node.data.length;
      position = stop;
      if (stop <= offset || start >= end) continue;
      parts.push([node, Math.max(offset, start) - start, Math.min(end, stop) - start]);
    }
    for (const [text, from, to] of parts) {
      let target = text;
      if (to < target.data.length) target.splitText(to);
      if (from > 0) target = target.splitText(from);
      const mark = document.createElement('mark');
      mark.className = className;
      mark.dataset.n = id;
      target.replaceWith(mark);
      mark.append(target);
    }
  }

  function applyMarks() {
    const key = JSON.stringify(notes.map(n => [n.id, n.kind, n.color, n.block, n.offset, n.length]));
    if (key === marksKey) return;
    marksKey = key;
    renderArticle(current);
    for (const note of notes) {
      const block = article.querySelector(`[data-b="${note.block}"]`);
      if (!block || note.block < 0) continue;
      markRange(block, note.offset, note.length, note.kind === 'question' ? 'q' : note.color, note.id);
    }
  }

  // ---------- cards ----------

  // Inline code and bold in an answer. Everything else is plain text.
  function inline(text, into) {
    text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(part => {
      if (/^`[^`]+`$/.test(part)) {
        const code = document.createElement('code');
        code.textContent = part.slice(1, -1);
        into.append(code);
      } else if (/^\*\*[^*]+\*\*$/.test(part)) {
        const b = document.createElement('b');
        b.textContent = part.slice(2, -2);
        into.append(b);
      } else if (part) {
        into.append(part);
      }
    });
  }

  function paragraphs(text, into) {
    for (const chunk of text.split(/\n{2,}/)) {
      if (!chunk.trim()) continue;
      const p = document.createElement('p');
      inline(chunk, p);
      into.append(p);
    }
  }

  function span(text, className) {
    const el = document.createElement('span');
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }

  // A card action. A button takes the keyboard focus and has a role for VoiceOver.
  function button(text, action, className) {
    const el = document.createElement('button');
    el.type = 'button';
    if (className) el.className = className;
    el.textContent = text;
    el.onclick = action;
    return el;
  }

  // A note of the reader: a plain card with the note and where it was made.
  function mine(note) {
    const c = document.createElement('div');
    c.className = 'card mine';
    c.dataset.id = note.id;
    const head = document.createElement('div');
    head.className = 'ch';
    const kind = document.createElement('b');
    kind.textContent = 'Your note';
    head.append(kind, span(note.origin, 'when'));
    c.append(head);
    paragraphs(note.comment, c);
    return c;
  }

  function card(note) {
    if (note.kind === 'note') return mine(note);
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.id = note.id;
    const head = document.createElement('div');
    head.className = 'ch';
    const kind = document.createElement('b');
    kind.textContent = '✳ ' + note.label;
    head.append(kind, span(note.agent || 'Agent'));
    if (collapsed.has(note.id)) {
      c.classList.add('min');
      head.append(span(note.quote.length > 28 ? note.quote.slice(0, 28) + '…' : note.quote));
      c.append(head);
      const expand = () => { collapsed.delete(note.id); renderCards(); };
      c.onclick = expand;
      c.tabIndex = 0;
      c.setAttribute('role', 'button');
      c.setAttribute('aria-label', 'Show ' + note.label);
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); expand(); } };
      return c;
    }
    const close = button('×', () => { collapsed.add(note.id); renderCards(); }, 'x');
    close.title = 'Hide';
    close.setAttribute('aria-label', 'Hide');
    head.append(close);
    const quote = document.createElement('div');
    quote.className = 'quote';
    quote.textContent = note.quote.length > 90 ? note.quote.slice(0, 90) + '…' : note.quote;
    c.append(head, quote);
    note.turns.forEach((turn, index) => {
      if (turn.question) {
        const q = document.createElement('div');
        q.className = 'q';
        q.textContent = turn.question;
        c.append(q);
      }
      if (turn.answer) {
        paragraphs(turn.answer, c);
      } else if (index === note.turns.length - 1 && note.pending) {
        const typing = document.createElement('p');
        typing.className = 'typing';
        typing.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
        c.append(typing);
      }
    });
    if (note.tools && !note.pending) {
      const tools = document.createElement('div');
      tools.className = 'tools';
      tools.textContent = note.tools;
      c.append(tools);
    }
    if (note.failure) {
      const p = document.createElement('p');
      p.className = 'failure';
      p.textContent = note.failure;
      c.append(p);
    }
    if (!note.pending) {
      const acts = document.createElement('div');
      acts.className = 'acts';
      const open = button('Open Note', () => post({ action: 'open', id: note.id }));
      const copy = button('Copy', () => post({ action: 'copy', id: note.id }));
      const more = button('Continue in Session', () => post({ action: 'continue', id: note.id }));
      more.title = 'Open a session with this thread and the page, with every tool';
      const turns = note.turns.length;
      acts.append(open, copy, more, span('#question' + (turns > 1 ? ` · ${turns} turns` : ''), 'muted'));
      const follow = document.createElement('input');
      follow.className = 'follow';
      follow.placeholder = 'Ask a follow-up';
      follow.onkeydown = e => {
        if (e.key !== 'Enter' || e.isComposing || !follow.value.trim()) return;
        post({ action: 'followup', id: note.id, question: follow.value.trim() });
        follow.value = '';
      };
      c.append(acts, follow);
    }
    return c;
  }

  function renderCards() {
    const focused = document.activeElement?.matches?.('.follow') ? document.activeElement.closest('.card')?.dataset.id : null;
    margin.replaceChildren(...notes.filter(n => n.kind === 'question' || n.kind === 'note').map(card));
    if (focused) margin.querySelector(`[data-id="${focused}"] .follow`)?.focus();
    placeCards();
  }

  // Each card sits beside its mark. A card never overlaps the card above it.
  function placeCards() {
    if (matchMedia('(max-width: 899px)').matches) {
      margin.style.minHeight = '';
      for (const c of margin.children) c.style.top = '';
      return;
    }
    const top = margin.getBoundingClientRect().top;
    let floor = 0;
    const cards = [...margin.children].map(c => {
      const mark = article.querySelector(`mark[data-n="${c.dataset.id}"]`);
      return [c, mark ? mark.getBoundingClientRect().top - top - 10 : null];
    }).sort((a, b) => (a[1] ?? Infinity) - (b[1] ?? Infinity));
    for (const [c, want] of cards) {
      const y = Math.max(want ?? floor, floor);
      c.style.top = y + 'px';
      floor = y + c.offsetHeight + 12;
    }
    margin.style.minHeight = floor + 'px';
  }

  // ---------- selection ----------

  // The block, offset, and text of the selection, clipped to the first block.
  function selectedAnchor() {
    const selection = getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return null;
    const range = selection.getRangeAt(0);
    const node = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
    const block = node?.closest?.('[data-b]');
    if (!block || !article.contains(block)) return null;
    const before = document.createRange();
    before.selectNodeContents(block);
    before.setEnd(range.startContainer, range.startOffset);
    let offset = before.toString().length;
    const inBlock = range.cloneRange();
    if (!block.contains(range.endContainer)) inBlock.setEnd(block, block.childNodes.length);
    let quote = inBlock.toString();
    const lead = quote.length - quote.trimStart().length;
    offset += lead;
    quote = quote.trim();
    if (!quote) return null;
    return { quote, block: Number(block.dataset.b), offset };
  }

  function hideBar() {
    bar.style.display = 'none';
    askline.style.display = 'none';
    noteline.style.display = 'none';
  }

  function placeBar() {
    const range = getSelection().getRangeAt(0);
    const rect = range.getClientRects()[0] || range.getBoundingClientRect();
    const box = article.getBoundingClientRect();
    article.append(bar, askline, noteline);
    bar.style.display = 'flex';
    const left = Math.max(0, Math.min(rect.left - box.left + rect.width / 2 - bar.offsetWidth / 2, box.width - bar.offsetWidth));
    bar.style.left = left + 'px';
    bar.style.top = Math.max(rect.top - box.top - bar.offsetHeight - 8, -36) + 'px';
  }

  function openAsk() {
    pendingAnchor = selectedAnchor();
    if (!pendingAnchor) return;
    if (bar.style.display !== 'flex') placeBar();
    askline.style.display = 'flex';
    askline.style.left = Math.min(parseFloat(bar.style.left) || 0, Math.max(0, article.offsetWidth - 380)) + 'px';
    askline.style.top = bar.style.top;
    bar.style.display = 'none';
    askinput.value = '';
    askinput.focus();
  }

  function openNote() {
    pendingAnchor = selectedAnchor();
    if (!pendingAnchor) return;
    if (bar.style.display !== 'flex') placeBar();
    noteline.style.display = 'flex';
    noteline.style.left = Math.min(parseFloat(bar.style.left) || 0, Math.max(0, article.offsetWidth - 380)) + 'px';
    noteline.style.top = bar.style.top;
    bar.style.display = 'none';
    noteinput.value = '';
    noteinput.focus();
  }

  document.addEventListener('mouseup', e => {
    if (bar.contains(e.target) || askline.contains(e.target) || noteline.contains(e.target) || margin.contains(e.target)) return;
    setTimeout(() => {
      if (selectedAnchor()) { askline.style.display = 'none'; noteline.style.display = 'none'; placeBar(); } else { hideBar(); }
    });
  });

  bar.addEventListener('mousedown', e => e.preventDefault());
  bar.addEventListener('click', e => {
    const target = e.target.closest('[data-act]');
    if (!target) return;
    const act = target.dataset.act;
    if (act === 'ask') { openAsk(); return; }
    if (act === 'note') { openNote(); return; }
    const anchor = selectedAnchor();
    hideBar();
    if (!anchor) return;
    getSelection().removeAllRanges();
    if (act === 'highlight') post({ action: 'highlight', color: target.dataset.color, anchor });
    else if (act === 'capture') post({ action: 'capture', text: anchor.quote });
    else post({ action: act, anchor });
  });

  askinput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideBar(); return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    const question = askinput.value.trim();
    if (!question || !pendingAnchor) return;
    post({ action: 'ask', anchor: pendingAnchor, question });
    pendingAnchor = null;
    getSelection().removeAllRanges();
    hideBar();
  });

  noteinput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideBar(); return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    const text = noteinput.value.trim();
    if (!text || !pendingAnchor) return;
    post({ action: 'note', anchor: pendingAnchor, text });
    pendingAnchor = null;
    getSelection().removeAllRanges();
    hideBar();
  });

  // Moves to the next or the previous mark below or above the middle of the screen.
  function jump(direction) {
    const middle = innerHeight / 2;
    const marks = [...article.querySelectorAll('mark')].filter((m, i, all) => all.findIndex(o => o.dataset.n === m.dataset.n) === i);
    const tops = marks.map(m => [m, m.getBoundingClientRect().top]);
    const next = direction > 0
      ? tops.filter(([, top]) => top > middle + 4).sort((a, b) => a[1] - b[1])[0]
      : tops.filter(([, top]) => top < middle - 4).sort((a, b) => b[1] - a[1])[0];
    if (next) next[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  document.addEventListener('keydown', e => {
    const typing = e.target.closest?.('input, textarea');
    if (e.metaKey && e.key.toLowerCase() === 'k' && selectedAnchor()) { e.preventDefault(); openAsk(); }
    else if (!typing && !e.metaKey && !e.ctrlKey && !e.altKey && e.key.toLowerCase() === 'n' && selectedAnchor()) { e.preventDefault(); openNote(); }
    else if (!typing && e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); jump(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Escape') hideBar();
  });

  // Reports the first block on the screen and the part of the page above it,
  // after the scroll stops.
  let positionTimer = null;
  window.addEventListener('scroll', () => {
    if (!current) return;
    clearTimeout(positionTimer);
    positionTimer = setTimeout(() => {
      const top = 60;
      const first = [...article.querySelectorAll('[data-b]')].find(el => el.getBoundingClientRect().bottom > top);
      const room = document.documentElement.scrollHeight - innerHeight;
      const progress = room > 0 ? Math.min(1, Math.max(0, scrollY / room)) : 1;
      post({ action: 'position', block: first ? Number(first.dataset.b) : 0, progress });
    }, 250);
  }, { passive: true });

  // The article node changes with each drawing, so the document listens.
  document.addEventListener('click', e => {
    const mark = e.target.closest?.('#article mark.q');
    if (!mark || !getSelection().isCollapsed) return;
    collapsed.delete(mark.dataset.n);
    renderCards();
  });

  window.addEventListener('resize', placeCards);

  // ---------- focus ----------

  // Dims the blocks above the place where the article opens, and rings the
  // mark there. Both fade after a few seconds, so the reader sees the place.
  let focusTimer = null;
  function focusOn(index, marks) {
    clearFocus();
    article.querySelectorAll('[data-b]').forEach(el => el.classList.toggle('above', Number(el.dataset.b) < index));
    marks.forEach(m => m.classList.add('now'));
    focusTimer = setTimeout(clearFocus, 2600);
  }

  function clearFocus() {
    clearTimeout(focusTimer);
    article.querySelectorAll('.above').forEach(el => el.classList.remove('above'));
    article.querySelectorAll('mark.now').forEach(el => el.classList.remove('now'));
  }

  // ---------- API ----------

  let current = null;
  window.piper = {
    message,
    loading,
    render(data) {
      current = data;
      blocks = data.blocks;
      marksKey = '';
      notes = [];
      renderArticle(data);
      margin.replaceChildren();
    },
    setNotes(list) {
      if (!current) return;
      notes = list;
      applyMarks();
      renderCards();
    },
    scrollTo(id) {
      const marks = [...article.querySelectorAll(`mark[data-n="${id}"]`)];
      if (!marks.length) return;
      marks[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
      focusOn(Number(marks[0].closest('[data-b]')?.dataset.b ?? -1), marks);
    },
    scrollToBlock(index) {
      if (index <= 0) { clearFocus(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const block = article.querySelector(`[data-b="${index}"]`);
      if (!block) return;
      block.scrollIntoView({ block: 'start' });
      focusOn(index, []);
    }
  };
  post({ action: 'ready' });
})();
</script>
</body>
</html>
