<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; font-src file:; script-src 'unsafe-inline'; img-src https: http: data:; media-src https: http:">
<title>Reader</title>
<!--
The Reader tab of a link capture. Piper loads this page into a WKWebView and
calls window.piper with the article and its child notes. The page sends each
action to Piper through the "piper" message handler. The page has the
metrics of the September Write paper: Iowan Old Style at 18 points, a line
height of 1.65, and a column of 600 points. The colors match the zinc and
indigo of PiperTheme.
-->
<style>
:root {
  --font: "Noto Sans", -apple-system, BlinkMacSystemFont, sans-serif;
  --serif: "Iowan Old Style", "Palatino", Georgia, serif;
  --heading: "Fraunces", "Iowan Old Style", Georgia, serif;
  --label: #18181B;
  --secondary: #52525B;
  --tertiary: #71717A;
  --accent: #4F46E5;
  --claude: #F97316;
  --reader: #FFFFFF;
  --card: #FFFFFF;
  --sep: #E4E4E7;
  --hover: #F4F4F5;
  --textsel: rgba(99,102,241,.26);
  --mark: #E0E7FF;
  --mark-ink: #18181B;
  --quote-bar: #A5B4FC;
  --mark-green: rgba(74,222,128,.32);
  --mark-pink: rgba(244,114,182,.28);
  --bar: #18181B;
  --bar-hover: #3F3F46;
  --bar-key: #52525B;
  --bar-key-ink: #D4D4D8;
  --shine: rgba(0,0,0,.06);
  --code: #F4F4F5;
  --bar-glass: rgba(24,24,27,.86);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --label: #F4F4F5;
    --secondary: #D4D4D8;
    --tertiary: #A1A1AA;
    --accent: #818CF8;
    --claude: #FB923C;
    --reader: #27272A;
    --card: #27272A;
    --sep: #3F3F46;
    --hover: #3F3F46;
    --mark: #312E81;
    --mark-ink: #FFFFFF;
    --mark-green: rgba(74,222,128,.22);
    --mark-pink: rgba(244,114,182,.24);
    --shine: rgba(255,255,255,.1);
    --code: #323236;
    --bar-glass: rgba(9,9,11,.82);
  }
}
@font-face { font-family: "Noto Sans"; font-weight: 400; src: url("NotoSans-Regular.woff2") format("woff2"); }
@font-face { font-family: "Noto Sans"; font-weight: 500; src: url("NotoSans-Medium.woff2") format("woff2"); }
@font-face { font-family: "Noto Sans"; font-weight: 600 650; src: url("NotoSans-SemiBold.woff2") format("woff2"); }
@font-face { font-family: "Noto Sans"; font-weight: 700; src: url("NotoSans-Bold.woff2") format("woff2"); }
@font-face { font-family: "Fraunces"; font-weight: 100 900; src: url("Fraunces.woff2") format("woff2"); }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--reader); }
body { font: 16px/1.5 var(--font); color: var(--label); -webkit-font-smoothing: antialiased; }
.page { padding: 36px 56px 120px; position: relative; max-width: 712px; margin: 0 auto; }
/* The text fades at the top and the bottom edge of the paper while it scrolls, as in Safari Reader. */
body::before, body::after { content: ""; position: fixed; left: 0; right: 0; height: 28px; pointer-events: none; z-index: 4; }
body::before { top: 0; background: linear-gradient(var(--reader), rgba(0,0,0,0)); }
body::after { bottom: 0; background: linear-gradient(rgba(0,0,0,0), var(--reader)); }
.article { font: 18px/1.6 var(--serif); position: relative; min-width: 0; text-rendering: optimizeLegibility; hanging-punctuation: first; }
.article ::selection { background: var(--textsel); }
.article h1 { font-family: var(--heading); font-weight: 600; font-size: 1.9em; line-height: 1.15; letter-spacing: -.022em; margin: 0 0 .4em; text-wrap: balance; }
.article h2 { font-family: var(--font); font-weight: 650; font-size: 1.35em; line-height: 1.25; letter-spacing: -.01em; margin: 1.6em 0 .42em; }
.article h3 { font-family: var(--font); font-weight: 600; font-size: 1.1em; line-height: 1.3; margin: 1.4em 0 .4em; }
.byline { font: 500 14px var(--font); color: var(--secondary); margin-bottom: 2.2em; display: flex; flex-wrap: wrap; }
.byline span + span::before { content: "\00B7"; margin: 0 8px; color: var(--tertiary); }
.article p, .article li, .article blockquote, .article pre { margin: 0 0 1em; }
.article li { margin: 0 0 .3em 1.2em; display: list-item; list-style: disc; }
.article li + :not(li) { margin-top: .85em; }
.article blockquote { position: relative; margin-left: 0; padding: .1em 0 .1em 20px; color: var(--secondary); font-style: italic; }
.article blockquote::before { content: ""; position: absolute; left: 0; top: .25em; bottom: .25em; width: 3px; border-radius: 2px; background: var(--quote-bar); }
.article pre { font: 14px/1.55 "IBM Plex Mono", ui-monospace, monospace; white-space: pre-wrap; background: var(--code); border: .5px solid var(--sep); padding: 12px 14px; border-radius: 10px; }
.article :not(pre) > code { font: .82em "IBM Plex Mono", ui-monospace, monospace; background: var(--code); padding: .12em .36em; border-radius: 5px; }
.article figure { margin: 4px 0 1.2em; }
.article figure img, .article figure video { display: block; max-width: 100%; height: auto; margin: 0 auto; border-radius: 12px; }
.article figure.broken { display: none; }
.article figcaption { font: 14px/1.45 var(--font); color: var(--tertiary); margin-top: 6px; text-align: center; }
.article .embed { display: block; position: relative; width: 100%; aspect-ratio: 16 / 9; padding: 0; border: 0; border-radius: 12px; overflow: hidden; background: var(--hover); cursor: pointer; }
.article .embed img { width: 100%; height: 100%; object-fit: cover; border-radius: 0; }
.article .embed::after { content: attr(data-label); position: absolute; left: 12px; bottom: 12px; font: 600 14px var(--font); color: #fff; background: rgba(0,0,0,.65); padding: 5px 10px; border-radius: 999px; }
.article .table { overflow-x: auto; margin: 0 0 18px; }
.article table { border-collapse: collapse; font: 14px/1.45 var(--font); }
.article th, .article td { border-bottom: .5px solid var(--sep); padding: 6px 14px 6px 0; text-align: left; vertical-align: top; }
.article th { font-weight: 600; }
mark { color: inherit; border-radius: 4px; padding: .06em .14em; margin: 0 -.14em; background: none; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.yellow, mark.pending { background: var(--mark); color: var(--mark-ink); }
mark.green { background: var(--mark-green); }
mark.pink { background: var(--mark-pink); }
mark.now { box-shadow: 0 0 0 3px var(--accent); }
.article [data-b] { transition: opacity .6s ease; }
.article .above { opacity: .4; }
mark { transition: box-shadow .6s ease; }
mark.q { text-decoration: underline; text-decoration-color: var(--claude); text-decoration-thickness: 2px; text-underline-offset: 3px; cursor: pointer; }
.message { font: 16px var(--font); color: var(--secondary); padding-top: 120px; text-align: center; grid-column: 1 / -1; animation: fade .3s ease both; }

/* loading: the known site and title, and lines that shimmer until the text arrives */
.sk { height: 13px; margin: 0 0 11px; border-radius: 4px; background: linear-gradient(90deg, var(--hover) 25%, var(--shine) 50%, var(--hover) 75%); background-size: 300% 100%; animation: shimmer 1.6s ease-in-out infinite; }
.sk.title { height: 32px; width: 78%; margin: 8px 0 10px; }
.sk.title + .sk.title { width: 46%; }
.sk.byline { height: 11px; width: 28%; margin: 4px 0 30px; }
.skeleton .para { margin-bottom: 26px; }
.skeleton h1 { animation: breathe 2.4s ease-in-out infinite; }
.slow { font: 14px var(--font); color: var(--tertiary); opacity: 0; transition: opacity .6s ease; }
.slow.on { opacity: 1; }
.enter > * { animation: rise .45s cubic-bezier(.2, .7, .2, 1) both; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
@keyframes breathe { 50% { opacity: .55; } }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sk, .skeleton h1, .enter > *, .message { animation: none !important; }
  .selbar span { transition: none; }
}
.message b { display: block; font-size: 18px; color: var(--label); margin-bottom: 4px; font-weight: 600; }

/* selection bar */
/* A compact dark capsule on a blur, as the edit menu of macOS. */
.selbar { position: absolute; display: none; align-items: center; flex-wrap: wrap; max-width: 100%; gap: 0; padding: 3px; border-radius: 999px; background: var(--bar-glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); border: .5px solid rgba(255,255,255,.12); color: #fff; font: 500 14px var(--font); box-shadow: 0 1px 2px rgba(0,0,0,.2), 0 10px 28px rgba(0,0,0,.28); white-space: nowrap; z-index: 5; -webkit-user-select: none; user-select: none; }
.selbar span { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border-radius: 999px; cursor: default; transition: background .12s ease; }
.selbar span:hover { background: var(--bar-hover); }
.selbar .div { width: 1px; height: 16px; background: var(--bar-key); margin: 0 3px; padding: 0; }
.selbar .div:hover { background: var(--bar-key); }
.selbar kbd { font: 500 14px var(--font); line-height: 1; padding: 2px 5px; border: .5px solid var(--bar-key); border-radius: 6px; color: var(--bar-key-ink); }
.askline { position: absolute; display: none; align-items: center; gap: 8px; width: 420px; max-width: 100%; padding: 4px 4px 4px 16px; border-radius: 999px; background: var(--bar-glass); -webkit-backdrop-filter: blur(20px) saturate(180%); backdrop-filter: blur(20px) saturate(180%); color: #fff; font: 16px var(--font); box-shadow: 0 6px 20px rgba(0,0,0,.3); z-index: 6; }
.askline input { flex: 1; min-width: 0; height: 32px; background: none; border: 0; outline: 0; color: #fff; font: inherit; }
.askline input::placeholder { color: rgba(255,255,255,.55); }
.askline kbd { font: 500 14px var(--font); padding: 4px 8px; border-radius: 7px; background: var(--claude); color: #fff; }
.askline .star { color: var(--claude); }

/* the note slip under a passage */
#noteline { display: none; }
.slip { font: 16px/1.5 var(--font); margin: -.2em 0 1.1em; padding: 2px 0 2px 16px; border-left: 2px solid var(--accent); color: var(--label); }
.slip input { width: 100%; height: 44px; border: 0; background: var(--hover); border-radius: 12px; padding: 0 12px; font: 16px var(--font); color: var(--label); caret-color: var(--accent); outline: 0; }
.slip input:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.slip small { display: block; margin-top: 6px; font-size: 14px; color: var(--tertiary); }

/* the notes and the questions, each under its passage */
.margin { display: none; }
.card { margin: -.2em 0 1.1em; padding: 2px 0 2px 16px; border-left: 2px solid var(--quote-bar); font: 16px/1.5 var(--font); }
.card .ch { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--tertiary); margin-bottom: 4px; }
.card .ch b { color: var(--claude); font-weight: 600; }
.card button { background: none; border: 0; margin: 0; padding: 0; font: inherit; color: inherit; cursor: default; border-radius: 4px; }
.card button:focus-visible, .card.min:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.card .ch .x { margin-left: auto; color: var(--tertiary); padding: 0 4px; }
.card .quote { display: none; }
.card p { margin: 0 0 8px; white-space: pre-line; overflow-wrap: anywhere; }
.card code { font: 14px "IBM Plex Mono", ui-monospace, monospace; background: var(--hover); padding: 0 3px; border-radius: 4px; }
.card .q { font-weight: 600; margin: 10px 0 4px; }
.card .ch + .q { margin-top: 0; }
.card .failure { color: var(--secondary); }
.card .tools { font-size: 14px; color: var(--tertiary); margin: -2px 0 6px; }
.card .acts { display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: center; padding-top: 4px; font-size: 14px; font-weight: 500; color: var(--accent); }
.card .acts button, .card .acts span { white-space: nowrap; }
.card .acts .muted { color: var(--tertiary); font-weight: 400; margin-left: auto; }
.card .follow { margin-top: 8px; width: 100%; height: 44px; border-radius: 12px; background: var(--hover); border: 0; outline: 0; padding: 0 12px; color: var(--label); font: 16px var(--font); }
.card .follow:focus-visible { box-shadow: 0 0 0 3px var(--accent); }
.card .follow::placeholder { color: var(--tertiary); }
.card.mine { border-left-color: var(--accent); }
.card.mine .ch b { color: var(--label); }
.card.mine .ch .when { margin-left: auto; color: var(--tertiary); }
.card.mine p:last-child { margin-bottom: 0; }
.card.min { color: var(--tertiary); cursor: default; }
.card.min .ch { margin: 0; }
.typing { margin: 0 0 4px; }
.typing i { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--tertiary); margin-right: 3px; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 50% { opacity: .2; } }
</style>
</head>
<body>
<div class="page" id="page">
  <div class="article" id="article"></div>
  <div class="margin" id="margin"></div>
</div>
<div class="selbar" id="selbar" role="toolbar" aria-label="Selected text">
  <span data-act="highlight" data-color="yellow">Highlight <kbd>H</kbd></span>
  <span data-act="note">Note <kbd>N</kbd></span>
  <span class="div"></span>
  <span data-act="ask">Ask <kbd>&#8984;K</kbd></span>
  <span data-act="explain">Explain</span>
  <span data-act="define">Define</span>
  <span data-act="capture">Capture</span>
</div>
<div class="askline" id="askline"><span class="star">&#10035;</span><input id="askinput" placeholder="Ask about the selected text"><kbd>&#8617;</kbd></div>
<div class="slip" id="noteline"><input id="noteinput" placeholder="Add a note" aria-label="Note on the highlight"><small>Return saves the note. Escape keeps the highlight only.</small></div>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const page = $('#page'), margin = $('#margin'), bar = $('#selbar'), askline = $('#askline'), askinput = $('#askinput');
  const noteline = $('#noteline'), noteinput = $('#noteinput');
  let article = $('#article');
  let blocks = [];
  let notes = [];
  let marksKey = '';
  let pendingAnchor = null;
  const collapsed = new Set();

  const post = message => window.webkit?.messageHandlers?.piper?.postMessage(message);

  // ---------- article ----------

  let slowTimer = null;
  // True while the page shows the loading lines. The article that replaces
  // them rises into place.
  let waiting = false;
  let knownTitle = false;
  let entering = false;

  function message(title, detail) {
    clearTimeout(slowTimer);
    waiting = false;
    article.classList.remove('skeleton');
    article.removeAttribute('aria-busy');
    article.replaceChildren();
    closeSlip();
    const box = document.createElement('div');
    box.className = 'message';
    const b = document.createElement('b');
    b.textContent = title;
    box.append(b, detail);
    article.append(box);
    blocks = [];
    marksKey = '';
  }

  function placeholderLine(className, width) {
    const el = document.createElement('div');
    el.className = 'sk' + (className ? ' ' + className : '');
    if (width) el.style.width = width + '%';
    return el;
  }

  // The site and the title that Piper already knows, and lines in the shape
  // of paragraphs. After a few seconds, a line says that the page is slow.
  function loading(info) {
    clearTimeout(slowTimer);
    const fresh = document.createElement('div');
    fresh.className = 'article skeleton';
    fresh.id = 'article';
    fresh.setAttribute('aria-busy', 'true');
    knownTitle = !!info.title;
    if (knownTitle) {
      const title = document.createElement('h1');
      title.textContent = info.title;
      fresh.append(title);
    } else {
      fresh.append(placeholderLine('title'), placeholderLine('title'));
    }
    const site = document.createElement('div');
    site.className = 'byline';
    site.textContent = info.site;
    fresh.append(site);
    for (const widths of [[100, 97, 99, 64], [100, 95, 72], [100, 98, 96, 99, 41]]) {
      const para = document.createElement('div');
      para.className = 'para';
      widths.forEach(width => para.append(placeholderLine('', width)));
      fresh.append(para);
    }
    const slow = document.createElement('div');
    slow.className = 'slow';
    slow.textContent = `Still reading ${info.site}. A slow page can take 20 seconds.`;
    fresh.append(slow);
    article.replaceWith(fresh);
    article = fresh;
    blocks = [];
    marksKey = '';
    waiting = true;
    slowTimer = setTimeout(() => slow.classList.add('on'), 5000);
  }

  // Makes the children of the article rise in turn. A title that the loading
  // lines already showed stays in place.
  function enter(el) {
    el.classList.add('enter');
    [...el.children].forEach((child, index) => {
      if (knownTitle && index < 1) { child.style.animation = 'none'; return; }
      child.style.animationDelay = Math.min(index * 40, 320) + 'ms';
    });
    setTimeout(() => {
      el.classList.remove('enter');
      [...el.children].forEach(child => { child.style.animation = ''; child.style.animationDelay = ''; });
    }, 1000);
  }

  function renderArticle(data) {
    const fresh = document.createElement('div');
    fresh.className = 'article';
    fresh.id = 'article';
    const title = document.createElement('h1');
    title.textContent = data.title;
    const byline = document.createElement('div');
    byline.className = 'byline';
    for (const part of [data.site, ...data.byline]) {
      const span = document.createElement('span');
      span.textContent = part;
      byline.append(span);
    }
    fresh.append(title, byline);
    data.blocks.forEach((block, index) => {
      const el = drawBlock(block);
      el.dataset.b = index;
      fresh.append(el);
    });
    article.replaceWith(fresh);
    article = fresh;
    // Piper sends the notes just after the article, and they draw the
    // article again. That second drawing rises too.
    if (waiting) {
      waiting = false;
      entering = true;
      clearTimeout(slowTimer);
      setTimeout(() => { entering = false; }, 200);
    }
    if (entering) enter(fresh);
  }

  // One block of the article. Only the text of a block and the caption of a
  // figure are text nodes, so the offsets of the marks match the block text.
  function drawBlock(block) {
    if (block.kind === 'image' || block.kind === 'video' || block.kind === 'embed') {
      const figure = document.createElement('figure');
      if (block.kind === 'image') {
        const img = document.createElement('img');
        img.loading = 'lazy';
        img.alt = block.alt || '';
        img.onerror = () => figure.classList.add('broken');
        img.src = block.src;
        figure.append(img);
      } else if (block.kind === 'video') {
        const video = document.createElement('video');
        video.controls = true;
        video.preload = 'metadata';
        if (block.poster) video.poster = block.poster;
        video.src = block.src;
        figure.append(video);
      } else {
        const link = document.createElement('button');
        link.className = 'embed';
        link.dataset.label = '▶ Watch on ' + new URL(block.src).hostname.replace(/^www\./, '');
        link.setAttribute('aria-label', link.dataset.label);
        if (block.poster) {
          const img = document.createElement('img');
          img.alt = '';
          img.src = block.poster;
          link.append(img);
        }
        link.onclick = () => post({ action: 'link', url: block.src });
        figure.append(link);
      }
      if (block.text) {
        const caption = document.createElement('figcaption');
        caption.textContent = block.text;
        figure.append(caption);
      }
      return figure;
    }
    if (block.kind === 'table') {
      const wrap = document.createElement('div');
      wrap.className = 'table';
      const table = document.createElement('table');
      (block.rows || []).forEach((cells, row) => {
        const line = table.insertRow();
        for (const value of cells) {
          const cell = document.createElement(row === 0 ? 'th' : 'td');
          cell.textContent = value;
          line.append(cell);
        }
      });
      wrap.append(table);
      return wrap;
    }
    const tag = { heading: 'h2', subheading: 'h3', quote: 'blockquote', item: 'li', code: 'pre' }[block.kind] || 'p';
    const el = document.createElement(tag);
    el.textContent = block.text;
    return el;
  }

  // Wraps the text from offset to offset + length of one block in new elements.
  function wrapRange(block, offset, length, make) {
    const walker = document.createTreeWalker(block, NodeFilter.SHOW_TEXT);
    const end = offset + length;
    let position = 0, node, parts = [];
    while ((node = walker.nextNode())) {
      const start = position, stop = position + node.data.length;
      position = stop;
      if (stop <= offset || start >= end) continue;
      parts.push([node, Math.max(offset, start) - start, Math.min(end, stop) - start]);
    }
    for (const [text, from, to] of parts) {
      let target = text;
      if (to < target.data.length) target.splitText(to);
      if (from > 0) target = target.splitText(from);
      const wrapper = make();
      target.replaceWith(wrapper);
      wrapper.append(target);
    }
  }

  function markRange(block, offset, length, className, id) {
    wrapRange(block, offset, length, () => {
      const mark = document.createElement('mark');
      mark.className = className;
      mark.dataset.n = id;
      return mark;
    });
  }

  function applyMarks() {
    const key = JSON.stringify(notes.map(n => [n.id, n.kind, n.color, n.block, n.offset, n.length]));
    if (key === marksKey) return;
    marksKey = key;
    renderArticle(current);
    for (const note of notes) {
      const block = article.querySelector(`[data-b="${note.block}"]`);
      if (!block || note.block < 0) continue;
      markRange(block, note.offset, note.length, note.kind === 'question' ? 'q' : note.color, note.id);
    }
  }

  // ---------- cards ----------

  // Inline code and bold in an answer. Everything else is plain text.
  function inline(text, into) {
    text.split(/(`[^`]+`|\*\*[^*]+\*\*)/).forEach(part => {
      if (/^`[^`]+`$/.test(part)) {
        const code = document.createElement('code');
        code.textContent = part.slice(1, -1);
        into.append(code);
      } else if (/^\*\*[^*]+\*\*$/.test(part)) {
        const b = document.createElement('b');
        b.textContent = part.slice(2, -2);
        into.append(b);
      } else if (part) {
        into.append(part);
      }
    });
  }

  function paragraphs(text, into) {
    for (const chunk of text.split(/\n{2,}/)) {
      if (!chunk.trim()) continue;
      const p = document.createElement('p');
      inline(chunk, p);
      into.append(p);
    }
  }

  function span(text, className) {
    const el = document.createElement('span');
    if (className) el.className = className;
    el.textContent = text;
    return el;
  }

  // A card action. A button takes the keyboard focus and has a role for VoiceOver.
  function button(text, action, className) {
    const el = document.createElement('button');
    el.type = 'button';
    if (className) el.className = className;
    el.textContent = text;
    el.onclick = action;
    return el;
  }

  // A note of the reader: a plain card with the note and where it was made.
  function mine(note) {
    const c = document.createElement('div');
    c.className = 'card mine';
    c.dataset.id = note.id;
    const head = document.createElement('div');
    head.className = 'ch';
    const kind = document.createElement('b');
    kind.textContent = 'Your note';
    head.append(kind, span(note.origin, 'when'));
    c.append(head);
    paragraphs(note.comment, c);
    return c;
  }

  function card(note) {
    if (note.kind === 'note') return mine(note);
    const c = document.createElement('div');
    c.className = 'card';
    c.dataset.id = note.id;
    const head = document.createElement('div');
    head.className = 'ch';
    const kind = document.createElement('b');
    kind.textContent = '✳ ' + note.label;
    head.append(kind, span(note.agent || 'Agent'));
    if (collapsed.has(note.id)) {
      c.classList.add('min');
      head.append(span(note.quote.length > 28 ? note.quote.slice(0, 28) + '…' : note.quote));
      c.append(head);
      const expand = () => { collapsed.delete(note.id); renderCards(); };
      c.onclick = expand;
      c.tabIndex = 0;
      c.setAttribute('role', 'button');
      c.setAttribute('aria-label', 'Show ' + note.label);
      c.onkeydown = e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); expand(); } };
      return c;
    }
    const close = button('×', () => { collapsed.add(note.id); renderCards(); }, 'x');
    close.title = 'Hide';
    close.setAttribute('aria-label', 'Hide');
    head.append(close);
    c.append(head);
    note.turns.forEach((turn, index) => {
      if (turn.question) {
        const q = document.createElement('div');
        q.className = 'q';
        q.textContent = turn.question;
        c.append(q);
      }
      if (turn.answer) {
        paragraphs(turn.answer, c);
      } else if (index === note.turns.length - 1 && note.pending) {
        const typing = document.createElement('p');
        typing.className = 'typing';
        typing.append(document.createElement('i'), document.createElement('i'), document.createElement('i'));
        c.append(typing);
      }
    });
    if (note.tools && !note.pending) {
      const tools = document.createElement('div');
      tools.className = 'tools';
      tools.textContent = note.tools;
      c.append(tools);
    }
    if (note.failure) {
      const p = document.createElement('p');
      p.className = 'failure';
      p.textContent = note.failure;
      c.append(p);
    }
    if (!note.pending) {
      const acts = document.createElement('div');
      acts.className = 'acts';
      const open = button('Open Note', () => post({ action: 'open', id: note.id }));
      const copy = button('Copy', () => post({ action: 'copy', id: note.id }));
      const more = button('Continue in Session', () => post({ action: 'continue', id: note.id }));
      more.title = 'Open a session with this thread and the page, with every tool';
      const turns = note.turns.length;
      acts.append(open, copy, more, span('#question' + (turns > 1 ? ` · ${turns} turns` : ''), 'muted'));
      const follow = document.createElement('input');
      follow.className = 'follow';
      follow.placeholder = 'Ask a follow-up';
      follow.onkeydown = e => {
        if (e.key !== 'Enter' || e.isComposing || !follow.value.trim()) return;
        post({ action: 'followup', id: note.id, question: follow.value.trim() });
        follow.value = '';
      };
      c.append(acts, follow);
    }
    return c;
  }

  // Each note and each question sits under the block of its passage. A
  // note whose passage is not in the article goes at the end.
  function renderCards() {
    const focused = document.activeElement?.matches?.('.follow') ? document.activeElement.closest('.card')?.dataset.id : null;
    article.querySelectorAll(':scope > .card').forEach(c => c.remove());
    for (const note of notes.filter(n => n.kind === 'question' || n.kind === 'note')) {
      const block = article.querySelector(`[data-b="${note.block}"]`);
      const c = card(note);
      if (block && note.block >= 0) {
        let after = block;
        while (after.nextElementSibling?.classList.contains('card')) after = after.nextElementSibling;
        after.after(c);
      } else {
        article.append(c);
      }
    }
    if (focused) article.querySelector(`.card[data-id="${focused}"] .follow`)?.focus();
  }

  // ---------- selection ----------

  // The block, offset, and text of the selection, clipped to the first block.
  function selectedAnchor() {
    const selection = getSelection();
    if (!selection.rangeCount || selection.isCollapsed) return null;
    const range = selection.getRangeAt(0);
    const node = range.startContainer.nodeType === 1 ? range.startContainer : range.startContainer.parentElement;
    const block = node?.closest?.('[data-b]');
    if (!block || !article.contains(block)) return null;
    const before = document.createRange();
    before.selectNodeContents(block);
    before.setEnd(range.startContainer, range.startOffset);
    let offset = before.toString().length;
    const inBlock = range.cloneRange();
    if (!block.contains(range.endContainer)) inBlock.setEnd(block, block.childNodes.length);
    let quote = inBlock.toString();
    const lead = quote.length - quote.trimStart().length;
    offset += lead;
    quote = quote.trim();
    if (!quote) return null;
    return { quote, block: Number(block.dataset.b), offset };
  }

  function hideBar() {
    bar.style.display = 'none';
    askline.style.display = 'none';
    closeSlip();
  }

  // Removes the note slip and the mark of its passage.
  function closeSlip() {
    noteline.style.display = 'none';
    article.querySelectorAll('mark.pending').forEach(m => m.replaceWith(...m.childNodes));
  }

  function placeBar() {
    const range = getSelection().getRangeAt(0);
    const rect = range.getClientRects()[0] || range.getBoundingClientRect();
    const box = article.getBoundingClientRect();
    article.append(bar, askline, noteline);
    bar.style.display = 'flex';
    const left = Math.max(0, Math.min(rect.left - box.left + rect.width / 2 - bar.offsetWidth / 2, box.width - bar.offsetWidth));
    bar.style.left = left + 'px';
    bar.style.top = Math.max(rect.top - box.top - bar.offsetHeight - 8, -36) + 'px';
  }

  function openAsk() {
    pendingAnchor = selectedAnchor();
    if (!pendingAnchor) return;
    if (bar.style.display !== 'flex') placeBar();
    askline.style.display = 'flex';
    askline.style.left = Math.min(parseFloat(bar.style.left) || 0, Math.max(0, article.offsetWidth - 380)) + 'px';
    askline.style.top = bar.style.top;
    bar.style.display = 'none';
    askinput.value = '';
    askinput.focus();
  }

  // Marks the passage and opens the note slip under its block. Return saves
  // the note. Escape keeps the highlight only.
  function openNote() {
    pendingAnchor = selectedAnchor();
    if (!pendingAnchor) return;
    const block = article.querySelector(`[data-b="${pendingAnchor.block}"]`);
    if (!block) return;
    bar.style.display = 'none';
    getSelection().removeAllRanges();
    markRange(block, pendingAnchor.offset, pendingAnchor.quote.length, 'pending', '');
    let after = block;
    while (after.nextElementSibling?.classList.contains('card')) after = after.nextElementSibling;
    after.after(noteline);
    noteline.style.display = 'block';
    noteinput.value = '';
    noteinput.focus();
    noteline.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
  }

  // Highlights the selected text, after H or a click on Highlight.
  function highlightSelection() {
    const anchor = selectedAnchor();
    if (!anchor) return false;
    hideBar();
    getSelection().removeAllRanges();
    post({ action: 'highlight', color: 'yellow', anchor });
    return true;
  }

  document.addEventListener('mouseup', e => {
    if (bar.contains(e.target) || askline.contains(e.target) || noteline.contains(e.target) || e.target.closest?.('.card')) return;
    setTimeout(() => {
      if (selectedAnchor()) { askline.style.display = 'none'; placeBar(); } else if (noteline.style.display !== 'block') { hideBar(); }
    });
  });

  bar.addEventListener('mousedown', e => e.preventDefault());
  bar.addEventListener('click', e => {
    const target = e.target.closest('[data-act]');
    if (!target) return;
    const act = target.dataset.act;
    if (act === 'ask') { openAsk(); return; }
    if (act === 'note') { openNote(); return; }
    const anchor = selectedAnchor();
    hideBar();
    if (!anchor) return;
    getSelection().removeAllRanges();
    if (act === 'highlight') post({ action: 'highlight', color: target.dataset.color, anchor });
    else if (act === 'capture') post({ action: 'capture', text: anchor.quote });
    else post({ action: act, anchor });
  });

  askinput.addEventListener('keydown', e => {
    if (e.key === 'Escape') { hideBar(); return; }
    if (e.key !== 'Enter' || e.isComposing) return;
    const question = askinput.value.trim();
    if (!question || !pendingAnchor) return;
    post({ action: 'ask', anchor: pendingAnchor, question });
    pendingAnchor = null;
    getSelection().removeAllRanges();
    hideBar();
  });

  noteinput.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      e.preventDefault();
      if (pendingAnchor) post({ action: 'highlight', color: 'yellow', anchor: pendingAnchor });
      pendingAnchor = null;
      hideBar();
      return;
    }
    if (e.key !== 'Enter' || e.isComposing) return;
    const text = noteinput.value.trim();
    if (!pendingAnchor) return;
    if (text) post({ action: 'note', anchor: pendingAnchor, text });
    else post({ action: 'highlight', color: 'yellow', anchor: pendingAnchor });
    pendingAnchor = null;
    hideBar();
  });

  // Moves to the next or the previous mark below or above the middle of the screen.
  function jump(direction) {
    const middle = innerHeight / 2;
    const marks = [...article.querySelectorAll('mark')].filter((m, i, all) => all.findIndex(o => o.dataset.n === m.dataset.n) === i);
    const tops = marks.map(m => [m, m.getBoundingClientRect().top]);
    const next = direction > 0
      ? tops.filter(([, top]) => top > middle + 4).sort((a, b) => a[1] - b[1])[0]
      : tops.filter(([, top]) => top < middle - 4).sort((a, b) => b[1] - a[1])[0];
    if (next) next[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
  }

  // H highlights the selected text and N adds a note to it. The paper
  // takes the other letters, such as T to tidy the desk.
  function key(name) {
    if (name === 'h') return highlightSelection();
    if (name === 'n' && selectedAnchor()) { openNote(); return true; }
    return false;
  }

  document.addEventListener('keydown', e => {
    const typing = e.target.closest?.('input, textarea');
    const plain = !e.metaKey && !e.ctrlKey && !e.altKey;
    if (e.metaKey && e.key.toLowerCase() === 'k' && selectedAnchor()) { e.preventDefault(); openAsk(); }
    else if (!typing && plain && !e.shiftKey && key(e.key.toLowerCase())) { e.preventDefault(); }
    else if (!typing && plain && !e.shiftKey && /^[a-z ]$/.test(e.key)) { e.preventDefault(); post({ action: 'key', key: e.key }); }
    else if (!typing && e.altKey && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { e.preventDefault(); jump(e.key === 'ArrowDown' ? 1 : -1); }
    else if (e.key === 'Escape' && (bar.style.display === 'flex' || askline.style.display === 'flex')) { e.preventDefault(); hideBar(); }
  });

  // Reports the first block on the screen and the part of the page above it,
  // after the scroll stops.
  let positionTimer = null;
  window.addEventListener('scroll', () => {
    if (!current) return;
    clearTimeout(positionTimer);
    positionTimer = setTimeout(() => {
      const top = 60;
      const first = [...article.querySelectorAll('[data-b]')].find(el => el.getBoundingClientRect().bottom > top);
      const room = document.documentElement.scrollHeight - innerHeight;
      const progress = room > 0 ? Math.min(1, Math.max(0, scrollY / room)) : 1;
      post({ action: 'position', block: first ? Number(first.dataset.b) : 0, progress });
    }, 250);
  }, { passive: true });

  // The article node changes with each drawing, so the document listens.
  document.addEventListener('click', e => {
    const mark = e.target.closest?.('#article mark.q');
    if (!mark || !getSelection().isCollapsed) return;
    collapsed.delete(mark.dataset.n);
    renderCards();
  });


  // ---------- focus ----------

  // Dims the blocks above the place where the article opens, and rings the
  // mark there. Both fade after a few seconds, so the reader sees the place.
  let focusTimer = null;
  function focusOn(index, marks) {
    clearFocus();
    article.querySelectorAll('[data-b]').forEach(el => el.classList.toggle('above', Number(el.dataset.b) < index));
    marks.forEach(m => m.classList.add('now'));
    focusTimer = setTimeout(clearFocus, 2600);
  }

  function clearFocus() {
    clearTimeout(focusTimer);
    article.querySelectorAll('.above').forEach(el => el.classList.remove('above'));
    article.querySelectorAll('mark.now').forEach(el => el.classList.remove('now'));
  }

  // ---------- API ----------

  let current = null;
  window.piper = {
    message,
    loading,
    key,
    scroll(by) { scrollBy(0, by); },
    render(data) {
      current = data;
      blocks = data.blocks;
      marksKey = '';
      notes = [];
      renderArticle(data);
    },
    setNotes(list) {
      if (!current) return;
      notes = list;
      applyMarks();
      renderCards();
    },
    scrollTo(id) {
      const marks = [...article.querySelectorAll(`mark[data-n="${id}"]`)];
      if (!marks.length) return;
      marks[0].scrollIntoView({ block: 'center', behavior: 'smooth' });
      focusOn(Number(marks[0].closest('[data-b]')?.dataset.b ?? -1), marks);
    },
    scrollToBlock(index) {
      if (index <= 0) { clearFocus(); scrollTo({ top: 0, behavior: 'smooth' }); return; }
      const block = article.querySelector(`[data-b="${index}"]`);
      if (!block) return;
      block.scrollIntoView({ block: 'start' });
      focusOn(index, []);
    }
  };
  post({ action: 'ready' });
})();
</script>
</body>
</html>
